<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Académie Stellaire - Visual Novel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Backgrounds */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease;
        }

        .bg-academy {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .bg-academy::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(255,215,0,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(138,43,226,0.1) 0%, transparent 50%);
        }

        .bg-library {
            background: linear-gradient(180deg, #2d1b0e 0%, #3d2817 50%, #1a0f08 100%);
        }

        .bg-library::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(90deg, rgba(139,69,19,0.3) 0px, rgba(139,69,19,0.3) 50px, transparent 50px, transparent 100px);
        }

        .bg-kitchen {
            background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 50%, #bdbdbd 100%);
        }

        .bg-trial {
            background: linear-gradient(180deg, #1a0000 0%, #330000 50%, #4d0000 100%);
        }

        .bg-trial::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(255,0,0,0.2) 0%, transparent 60%);
        }

        /* Character Sprites */
        .character-container {
            position: absolute;
            bottom: 200px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .character {
            position: relative;
            transition: all 0.3s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .character.speaking {
            transform: scale(1.05);
            filter: drop-shadow(0 10px 30px rgba(255,255,255,0.3));
        }

        .character.dead {
            filter: grayscale(100%) brightness(0.5);
        }

        /* Character SVG Designs */
        .char-sprite {
            width: 200px;
            height: 350px;
        }

        /* Dialogue Box */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,40,0.95) 100%);
            border: 3px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            z-index: 100;
        }

        #speaker-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #dialogue-text {
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 60px;
        }

        #continue-indicator {
            position: absolute;
            bottom: 10px;
            right: 20px;
            animation: blink 1s infinite;
            color: #ffd700;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Title Screen */
        #title-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
            z-index: 200;
        }

        #title-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            margin-bottom: 20px;
            text-align: center;
        }

        #title-screen h2 {
            font-size: 1.5rem;
            color: #ff4444;
            margin-bottom: 50px;
            letter-spacing: 5px;
        }

        .menu-button {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            padding: 15px 50px;
            margin: 10px;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .menu-button:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }

        /* Investigation UI */
        #investigation-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
            display: none;
        }

        #evidence-count {
            font-family: 'Orbitron', sans-serif;
            color: #ffd700;
            font-size: 1.2rem;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .clickable-area:hover {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        /* Evidence Popup */
        #evidence-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            border: 3px solid #ffd700;
            padding: 30px;
            border-radius: 10px;
            z-index: 150;
            display: none;
            max-width: 500px;
            text-align: center;
        }

        #evidence-popup h3 {
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 15px;
        }

        #evidence-popup p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Trial UI */
        #trial-ui {
            display: none;
        }

        .trial-podiums {
            position: absolute;
            width: 100%;
            height: 60%;
            top: 10%;
        }

        .trial-character {
            position: absolute;
            text-align: center;
        }

        .trial-character .name-plate {
            background: #333;
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Choices */
        #choices-container {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .choice-button {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.1rem;
            padding: 15px 40px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #4a9eff;
            color: #4a9eff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .choice-button:hover {
            background: #4a9eff;
            color: #000;
        }

        /* Evidence Selection */
        #evidence-selection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            border: 3px solid #ff4444;
            padding: 30px;
            border-radius: 10px;
            z-index: 150;
            display: none;
            max-width: 600px;
        }

        #evidence-selection h3 {
            color: #ff4444;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            text-align: center;
        }

        .evidence-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(50,50,50,0.8);
            border: 1px solid #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .evidence-item:hover {
            border-color: #ff4444;
            background: rgba(100,50,50,0.8);
        }

        .evidence-item h4 {
            color: #ffd700;
            margin-bottom: 5px;
        }

        /* Game Over / Victory Screens */
        #end-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #end-screen.victory {
            background: linear-gradient(180deg, #001a00 0%, #003300 50%, #001a00 100%);
        }

        #end-screen.defeat {
            background: linear-gradient(180deg, #1a0000 0%, #330000 50%, #1a0000 100%);
        }

        #end-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin-bottom: 30px;
        }

        #end-screen.victory h1 {
            color: #00ff00;
        }

        #end-screen.defeat h1 {
            color: #ff0000;
        }

        /* Monokuma-like Mascot */
        .mascot {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 50;
        }

        /* Screen Flash Effects */
        .flash {
            animation: flash 0.5s ease;
        }

        @keyframes flash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(3); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Truth Bullet Animation */
        .truth-bullet {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #ff4444;
            text-shadow: 0 0 20px #ff0000;
            animation: truthBullet 1s ease forwards;
            z-index: 160;
        }

        @keyframes truthBullet {
            0% {
                left: -200px;
                top: 50%;
                opacity: 1;
            }
            50% {
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        /* Phase Banner */
        #phase-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.8);
            opacity: 0;
            z-index: 180;
            pointer-events: none;
        }

        .show-banner {
            animation: showBanner 2s ease forwards;
        }

        @keyframes showBanner {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>

                <!-- Mascot: Stellaire (half star, half dark) -->

                    <linearGradient id="mascotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="50%" style="stop-color:#ffd700"/>
                        <stop offset="50%" style="stop-color:#1a1a1a"/>
                    </linearGradient>
                </defs>
                <polygon points="100,10 120,80 195,80 135,125 155,195 100,155 45,195 65,125 5,80 80,80"

            <button class="menu-button" onclick="startGame()">COMMENCER</button>
        </div>

        <!-- Background -->
        <div id="background" class="background bg-academy"></div>

        <!-- Phase Banner -->
        <div id="phase-banner"></div>

        <!-- Investigation UI -->
        <div id="investigation-ui">
            <div id="evidence-count">PREUVES: <span id="evidence-num">0</span>/6</div>
        </div>

        <!-- Character Container -->
        <div id="character-container" class="character-container"></div>

        <!-- Dialogue Box -->
        <div id="dialogue-box" style="display: none;">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
            <div id="continue-indicator">▼</div>
        </div>

        <!-- Choices Container -->
        <div id="choices-container"></div>

        <!-- Evidence Popup -->
        <div id="evidence-popup">
            <h3 id="evidence-title"></h3>
            <p id="evidence-description"></p>
            <button class="menu-button" onclick="closeEvidencePopup()">COMPRIS</button>
        </div>

        <!-- Evidence Selection (Trial) -->
        <div id="evidence-selection">
            <h3>PRESENTE UNE PREUVE</h3>
            <div id="evidence-list"></div>
        </div>

        <!-- End Screen -->
        <div id="end-screen">
            <h1 id="end-title"></h1>
            <p id="end-text" style="font-size: 1.3rem; max-width: 600px; text-align: center; line-height: 1.8; margin-bottom: 30px;"></p>
            <button class="menu-button" onclick="location.reload()">REJOUER</button>
        </div>
    </div>

        function startGame() {

            showDialogueBox();

        function showDialogueBox() {
            document.getElementById('dialogue-box').style.display = 'block';
        }

        function hideDialogueBox() {
            document.getElementById('dialogue-box').style.display = 'none';
        }

        function setBackground(bg) {
            const bgElement = document.getElementById('background');
            bgElement.className = 'background bg-' + bg;
        }

        function displayCharacters(charList) {
            const container = document.getElementById('character-container');
            container.innerHTML = '';

            charList.forEach((charId, index) => {
                if (charId === 'sakura_dead') {
                    // Dead Sakura
                    const charDiv = document.createElement('div');
                    charDiv.className = 'character dead';
                    charDiv.innerHTML = characters.sakura.sprite;
                    charDiv.style.transform = 'rotate(90deg) translateY(100px)';
                    charDiv.style.opacity = '0.7';
                    container.appendChild(charDiv);
                } else if (characters[charId]) {
                    const charDiv = document.createElement('div');
                    charDiv.className = 'character';
                    charDiv.id = 'char-' + charId;
                    charDiv.innerHTML = characters[charId].sprite;
                    container.appendChild(charDiv);
                }
            });
        }

        function highlightSpeaker(speakerName) {
            document.querySelectorAll('.character').forEach(char => {
                char.classList.remove('speaking');
            });

            for (let id in characters) {
                if (characters[id].name === speakerName) {
                    const charElement = document.getElementById('char-' + id);
                    if (charElement) {
                        charElement.classList.add('speaking');
                    }
                    break;
                }
            }
        }

        function typeText(element, text, speed = 30) {
            return new Promise(resolve => {
                element.textContent = '';
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) {
                        element.textContent += text[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        resolve();
                    }
                }, speed);
            });
        }

        async function playScene(sceneName) {
            const scene = story[sceneName];
            if (!scene || gameState.dialogueIndex >= scene.length) {
                advancePhase();
                return;
            }

            const dialogue = scene[gameState.dialogueIndex];

            if (dialogue.bg) {
                setBackground(dialogue.bg);
            }

            if (dialogue.chars) {
                displayCharacters(dialogue.chars);
            }

            if (dialogue.type === 'accusation') {
                showAccusationChoice(dialogue);
                return;
            }

            const speakerElement = document.getElementById('speaker-name');
            const textElement = document.getElementById('dialogue-text');

            speakerElement.textContent = dialogue.speaker;
            if (dialogue.speaker && characters[dialogue.speaker.toLowerCase()]) {
                speakerElement.style.color = characters[dialogue.speaker.toLowerCase()].color;
            } else {
                speakerElement.style.color = '#ffd700';
            }

            highlightSpeaker(dialogue.speaker);
            await typeText(textElement, dialogue.text);
        }

        function showAccusationChoice(dialogue) {
            const speakerElement = document.getElementById('speaker-name');
            const textElement = document.getElementById('dialogue-text');

            speakerElement.textContent = dialogue.speaker;
            textElement.textContent = dialogue.text;

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            choicesContainer.style.display = 'flex';

            dialogue.choices.forEach(charId => {
                const btn = document.createElement('button');
                btn.className = 'choice-button';
                btn.textContent = characters[charId].name;
                btn.onclick = () => makeAccusation(charId);
                choicesContainer.appendChild(btn);
            });
        }

        function makeAccusation(charId) {
            document.getElementById('choices-container').style.display = 'none';
            gameState.accusation = charId;

            if (charId === 'akira') {
                // Correct!
                showTruthBullet("COUPABLE IDENTIFIÉ!");
                setTimeout(() => {
                    gameState.phase = 'trial_correct';
                    gameState.dialogueIndex = 0;
                    playScene('trial_correct');
                }, 1500);
            } else {
                // Wrong!
                document.getElementById('game-container').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('game-container').classList.remove('shake');
                }, 500);
                gameState.phase = 'trial_wrong';
                gameState.dialogueIndex = 0;
                playScene('trial_wrong');
            }
        }

        function showTruthBullet(text) {
            const bullet = document.createElement('div');
            bullet.className = 'truth-bullet';

            setTimeout(() => bullet.remove(), 1500);

        function showPhaseBanner(text) {
            const banner = document.getElementById('phase-banner');
            banner.textContent = text;
            banner.classList.add('show-banner');

            setTimeout(() => {
                banner.classList.remove('show-banner');
            }, 2000);
        }

        function advancePhase() {
            switch(gameState.phase) {
                case 'prologue':
                    gameState.phase = 'daily';
                    gameState.dialogueIndex = 0;
                    playScene('daily');
                    break;
                case 'daily':
                    gameState.phase = 'discovery';
                    gameState.dialogueIndex = 0;
                    playScene('discovery');
                    break;
                case 'discovery':
                    gameState.phase = 'investigation';
                    gameState.dialogueIndex = 0;
                    showPhaseBanner("INVESTIGATION");
                    setTimeout(() => startInvestigation(), 2000);
                    break;
                case 'investigation':
                    if (gameState.evidence.length >= 6) {
                        gameState.phase = 'trial_intro';
                        gameState.dialogueIndex = 0;
                        hideInvestigationUI();
                        playScene('trial_intro');
                    }
                    break;
                case 'trial_intro':
                    gameState.phase = 'trial';
                    gameState.dialogueIndex = 0;
                    showPhaseBanner("PROCÈS");
                    setTimeout(() => playScene('trial'), 2000);
                    break;
                case 'trial_correct':
                    showEndScreen(true);
                    break;
                case 'trial_wrong':
                    showEndScreen(false);
                    break;
            }
        }

                div.style.left = area.x;
                div.style.top = area.y;
                div.style.width = area.w;
                div.style.height = area.h;

                if (area.text) {
                    div.textContent = area.text;
                    div.style.color = '#ffd700';
                    div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.justifyContent = 'center';
                    div.style.fontFamily = 'Orbitron';
                    div.style.backgroundColor = 'rgba(0,0,0,0.7)';
                    div.style.borderRadius = '10px';
                }

                if (area.evidence) {
                    div.onclick = () => findEvidence(area.evidence);
                } else if (area.id === 'back-library2') {
                    div.onclick = () => backToLibrary();
                }

                container.appendChild(div);
            });
        }

        function backToLibrary() {
            clearClickableAreas();
            setBackground('library');
            displayCharacters([]);
            createClickableAreas();
        }

        function findEvidence(evidenceId) {
            if (gameState.evidence.includes(evidenceId)) {
                showEvidencePopup(evidenceId, true);
                return;
            }

            gameState.evidence.push(evidenceId);
            document.getElementById('evidence-num').textContent = gameState.evidence.length;

            showEvidencePopup(evidenceId, false);

            // Hide the clicked area
            const areaElement = document.getElementById('area-' + evidenceId);
            if (areaElement) {
                areaElement.style.display = 'none';
            }

            if (gameState.evidence.length >= 6) {
                setTimeout(() => {
                    hideDialogueBox();
                    advancePhase();
                }, 1000);
            }
        }

        function showEvidencePopup(evidenceId, alreadyFound) {
            const popup = document.getElementById('evidence-popup');
            const data = evidenceData[evidenceId];

            document.getElementById('evidence-title').textContent =
                (alreadyFound ? "[Déjà trouvé] " : "[NOUVELLE PREUVE] ") + data.name;
            document.getElementById('evidence-description').textContent = data.description;

            popup.style.display = 'block';
        }

        function closeEvidencePopup() {
            document.getElementById('evidence-popup').style.display = 'none';
        }

        function hideInvestigationUI() {
            document.getElementById('investigation-ui').style.display = 'none';
            clearClickableAreas();
        }

        function showEndScreen(victory) {
            hideDialogueBox();
            const endScreen = document.getElementById('end-screen');
            const title = document.getElementById('end-title');
            const text = document.getElementById('end-text');

            endScreen.style.display = 'flex';

            if (victory) {
                endScreen.className = 'victory';
                title.textContent = "AFFAIRE CLASSÉE";
                text.textContent = "Grâce à ton sens de la déduction, le coupable a été démasqué. Sakura peut reposer en paix. Mais le jeu de massacre continue... Qui sera la prochaine victime?";
            } else {
                endScreen.className = 'defeat';
                title.textContent = "GAME OVER";
                text.textContent = "Tu as accusé la mauvaise personne. Le vrai coupable, Akira, s'est échappé et tous les autres étudiants ont été exécutés. La vérité meurt avec toi...";
            }
        }

        // ==================== EVENT LISTENERS ====================

        document.addEventListener('click', (e) => {
            if (e.target.closest('.menu-button') ||
                e.target.closest('.choice-button') ||
                e.target.closest('.clickable-area') ||
                e.target.closest('.evidence-item') ||
                e.target.closest('#evidence-popup')) {
                return;
            }

            if (gameState.phase === 'investigation') {
                return;
            }

            if (document.getElementById('dialogue-box').style.display !== 'none') {
                gameState.dialogueIndex++;

                const currentScene = story[gameState.phase];
                if (currentScene && gameState.dialogueIndex < currentScene.length) {
                    playScene(gameState.phase);
                } else {
                    advancePhase();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                document.dispatchEvent(new Event('click'));
            }
        });
    </script>
</body>
</html>
